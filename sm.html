<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubnetMaster</title>

<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2b313d;
    --fg:#e6e9ef; --muted:#8b93a3; --acc:#4ea1ff; --acc2:#ffb454;
    --net:#4ea1ff; --host:#ffb454; --ok:#4ade80; --bad:#f87171;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  /* light palette: follows the OS unless the user picked a theme manually */
  @media (prefers-color-scheme: light){
    :root:not([data-theme]){ --bg:#f4f6fa; --panel:#fff; --panel2:#eef1f6; --line:#d8dee9;
           --fg:#1a1d23; --muted:#5c6472; --net:#1668d4; --host:#b96a00; }
  }
  :root[data-theme="light"]{ --bg:#f4f6fa; --panel:#fff; --panel2:#eef1f6; --line:#d8dee9;
           --fg:#1a1d23; --muted:#5c6472; --net:#1668d4; --host:#b96a00; }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    line-height:1.5;padding:24px 16px 64px}
  .wrap{max-width:1000px;margin:0 auto}
  h1{font-size:1.5rem;margin:0 0 4px}
  h1 .by{font-size:.95rem;font-weight:400;color:var(--muted);margin-left:6px}
  .sub{color:var(--muted);margin:0 0 24px;font-size:.9rem}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  #theme{flex:none;display:flex;align-items:center;gap:7px;font:inherit;font-size:.82rem;
    background:var(--panel);color:var(--fg);border:1px solid var(--line);
    border-radius:8px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  #theme:hover{border-color:var(--acc);color:var(--acc)}
  #theme:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  #theme svg{width:15px;height:15px;flex:none}
  @media(max-width:520px){#theme span{display:none}#theme{padding:8px}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:18px;margin-bottom:16px}
  h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:0 0 14px;font-weight:600;
    display:flex;align-items:center;justify-content:space-between;gap:12px}
  .toggle{font:inherit;font-size:.72rem;letter-spacing:.06em;
    background:var(--panel2);color:var(--muted);border:1px solid var(--line);
    border-radius:6px;padding:3px 10px;cursor:pointer;text-transform:uppercase}
  .toggle:hover{color:var(--fg);border-color:var(--acc)}
  .toggle:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
  .card.collapsed h2{margin-bottom:0}
  .card.collapsed .body{display:none}
  label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:6px}
  input[type=text],select{width:100%;padding:10px 12px;border-radius:8px;
    border:1px solid var(--line);background:var(--panel2);color:var(--fg);
    font-family:var(--mono);font-size:1rem}
  input[type=text]:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px}
  input.err{border-color:var(--bad)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  @media(max-width:700px){.g2{grid-template-columns:1fr}}
  input[type=range]{width:100%;accent-color:var(--acc);margin:6px 0 0}
  #wcRange{accent-color:var(--acc2)}
  .slbl{display:flex;justify-content:space-between;align-items:baseline}
  .slbl b{font-family:var(--mono);color:var(--fg);font-size:.95rem}
  table{width:100%;border-collapse:collapse;font-size:.92rem}
  td{padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  tr:last-child td{border-bottom:none}
  td.k{color:var(--muted);width:42%;white-space:nowrap}
  td.v{font-family:var(--mono);display:flex;align-items:flex-start;
    justify-content:space-between;gap:8px}
  td.v .txt{min-width:0;word-break:break-word}
  .cp{flex:none;font-family:system-ui;font-size:.68rem;letter-spacing:.05em;
    text-transform:uppercase;background:transparent;color:var(--muted);
    border:1px solid var(--line);border-radius:5px;padding:2px 7px;cursor:pointer;
    opacity:.55;transition:opacity .12s,color .12s,border-color .12s}
  .cp:hover{opacity:1;color:var(--acc);border-color:var(--acc)}
  .cp:focus-visible{opacity:1;outline:2px solid var(--acc);outline-offset:1px}
  .cp.done{opacity:1;color:var(--ok);border-color:var(--ok)}
  .bin{font-family:var(--mono);font-size:.86rem;letter-spacing:.5px;
    word-break:break-all;line-height:1.9}
  .bin .d{color:var(--muted)}
  .n{color:var(--net);font-weight:600}
  .h{color:var(--host);font-weight:600}
  .legend{font-size:.78rem;color:var(--muted);margin-top:10px}
  .legend i{font-style:normal;font-weight:600}
  .binrow{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;
    padding:8px 0;border-bottom:1px solid var(--line)}
  .binrow:last-child{border-bottom:none}
  .binrow span.lab{color:var(--muted);font-size:.82rem}
  @media(max-width:700px){.binrow{grid-template-columns:1fr auto;gap:2px 10px}
    .binrow span.lab{grid-column:1/-1}}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.78rem;
    font-family:system-ui;background:var(--panel2);border:1px solid var(--line)}
  .badge.priv{color:var(--ok);border-color:var(--ok)}
  .badge.pub{color:var(--acc)}
  .msg{color:var(--bad);font-size:.85rem;margin-top:6px;min-height:1em}
  #cntNum{width:88px;padding:3px 8px;border-radius:6px;border:1px solid var(--line);
    background:var(--panel2);color:var(--fg);font-family:var(--mono);font-size:.9rem;text-align:right}
  #cntNum:focus{outline:2px solid var(--acc);outline-offset:-1px}
  .note{font-size:.8rem;color:var(--muted);margin:0 0 10px;min-height:1em}
  .swipe{display:none;font-size:.75rem;color:var(--muted);margin:0 0 8px}
  .listbar{display:flex;gap:18px;align-items:flex-end;margin-bottom:14px;flex-wrap:wrap}
  .listbar .sl{flex:1 1 260px}
  .btn{flex:none;font:inherit;font-size:.85rem;background:var(--acc);color:#fff;
    border:1px solid var(--acc);border-radius:8px;padding:9px 16px;cursor:pointer;
    display:flex;align-items:center;gap:8px}
  .btn:hover{filter:brightness(1.1)}
  .btn:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  .btn svg{width:15px;height:15px}
  .scroll{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  #tList th{position:sticky;top:0;z-index:1;background:var(--panel2);color:var(--muted);
    font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;text-align:left;
    padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  #tList td{font-family:var(--mono);font-size:.86rem;padding:6px 10px;white-space:nowrap}
  #tList td.idx{color:var(--muted);font-size:.78rem}
  #tList tr:hover td{background:var(--panel2)}
  #tList td.act{text-align:right;padding:4px 8px}
  /* ===================== phones (<=600px) ===================== */
  @media (max-width:600px){
    body{padding:14px 10px 48px}
    .card{padding:14px;border-radius:10px;margin-bottom:12px}
    h1{font-size:1.25rem}
    h1 .by{display:block;margin:2px 0 0;font-size:.8rem}
    .sub{margin-bottom:18px}

    /* iOS zooms into any field smaller than 16px - keep them all at 16px */
    input[type=text],select,#cntNum{font-size:16px}
    #cntNum{width:96px}

    /* detail tables: label above the value instead of two cramped columns */
    #t1,#t2,#t1 tbody,#t2 tbody,#t1 tr,#t2 tr{display:block}
    #t1 tr,#t2 tr{border-bottom:1px solid var(--line);padding:2px 0}
    #t1 tr:last-child,#t2 tr:last-child{border-bottom:none}
    #t1 td,#t2 td{border-bottom:none}
    #t1 td.k,#t2 td.k{display:block;width:auto;white-space:normal;
      padding:6px 2px 0;font-size:.76rem}
    #t1 td.v,#t2 td.v{padding:0 2px 7px;font-size:.95rem}

    /* binary: smaller and without letter-spacing, so 32 bits fit on one line */
    .bin{font-size:.72rem;letter-spacing:0;word-break:normal}
    .binrow{padding:7px 0;gap:4px 8px}
    .legend{font-size:.72rem;line-height:1.7}

    /* subnet list stays a real table - just more compact and scrollable sideways */
    .scroll{max-height:60vh;border-radius:8px;-webkit-overflow-scrolling:touch}
    #tList th{padding:7px 8px;font-size:.66rem}
    #tList td{font-size:.78rem;padding:5px 8px}
    #tList td.act{padding:3px 6px}
    .swipe{display:block}

    .listbar{gap:12px}
    .listbar .sl{flex:1 1 100%}
    .btn{width:100%;justify-content:center;padding:11px 16px}
    .note{font-size:.76rem}
  }
  footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
    text-align:center;color:var(--muted);font-size:.85rem}
  footer b{color:var(--fg);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div>
      <h1>Subnet Master v1.0<span class="by">by Ewald Jeitler</span></h1>
      <p class="sub">IPv4 · CIDR · Wildcard · Binary</p>
    </div>
    <button id="theme" title="Toggle dark / light mode" aria-label="Toggle dark or light mode">
      <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" style="display:none">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <span id="themeLbl">Dark</span>
    </button>
  </div>

  <div class="card" id="cardInput">
    <h2>Input <button class="toggle" data-target="cardInput">Hide</button></h2>
    <div class="body">
      <div class="grid g2">
        <div>
          <label for="ip">IP address — plain, <code>/26</code> or with mask / wildcard after a space</label>
          <input id="ip" type="text" value="192.168.10.55" spellcheck="false"
                 autocomplete="off" maxlength="31"
                 placeholder="192.168.10.55  ·  10.0.0.1/26  ·  172.16.5.9 255.255.0.0">
          <div class="msg" id="err"></div>
        </div>
        <div>
          <label for="sel">Select subnet mask</label>
          <select id="sel"></select>
        </div>
      </div>

      <div class="grid g2" style="margin-top:16px">
        <div>
          <div class="slbl"><label for="mRange">Mask (prefix / network bits)</label><b id="mLbl">/24</b></div>
          <input id="mRange" type="range" min="0" max="32" value="24">
        </div>
        <div>
          <div class="slbl"><label for="wcRange">Wildcard (host bits)</label><b id="wLbl">8</b></div>
          <input id="wcRange" type="range" min="0" max="32" value="8">
        </div>
      </div>
    </div>
  </div>

  <div class="grid g2">
    <div class="card" id="cardNet">
      <h2>Network Details <button class="toggle" data-target="cardNet">Hide</button></h2>
      <div class="body"><table><tbody id="t1"></tbody></table></div>
    </div>
    <div class="card" id="cardHosts">
      <h2>Address Range &amp; Hosts <button class="toggle" data-target="cardHosts">Hide</button></h2>
      <div class="body"><table><tbody id="t2"></tbody></table></div>
    </div>
  </div>

  <div class="card" id="cardBin">
    <h2>Binary Representation <button class="toggle" data-target="cardBin">Hide</button></h2>
    <div class="body">
      <div id="bins"></div>
      <div class="legend">
        <i class="n">■ Network portion (network bits)</i> &nbsp;·&nbsp; <i class="h">■ Host portion (host bits)</i>
      </div>
    </div>
  </div>

  <div class="card" id="cardList">
    <h2>Subnet List <button class="toggle" data-target="cardList">Hide</button></h2>
    <div class="body">
      <div class="listbar">
        <div class="sl">
          <div class="slbl">
            <label for="cntRange">Number of subnets</label>
            <input id="cntNum" type="number" min="1" value="16" title="Type any count - larger than the slider is allowed">
          </div>
          <input id="cntRange" type="range" min="1" max="512" value="16">
        </div>
        <button class="btn" id="xlsx">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
          </svg>
          Download .xlsx
        </button>
      </div>
      <div class="note" id="listNote"></div>
      <div class="swipe">← swipe sideways for all columns →</div>
      <div class="scroll"><table id="tList"></table></div>
    </div>
  </div>

  <footer><b>SubnetMaster</b> — by Ewald Jeitler</footer>
</div>

<script>
const $ = id => document.getElementById(id);

/* ---------- theme switch (remembers the choice) ---------- */
(function(){
  const root = document.documentElement;
  const store = {
    get(){ try{ return localStorage.getItem('sm-theme'); }catch(e){ return null; } },
    set(v){ try{ localStorage.setItem('sm-theme', v); }catch(e){} }
  };
  const sysDark = () => !window.matchMedia('(prefers-color-scheme: light)').matches;

  function apply(mode){
    root.setAttribute('data-theme', mode);
    const dark = mode === 'dark';
    $('icoSun').style.display  = dark ? 'none' : '';
    $('icoMoon').style.display = dark ? '' : 'none';
    $('themeLbl').textContent  = dark ? 'Dark' : 'Light';
  }

  apply(store.get() || (sysDark() ? 'dark' : 'light'));

  $('theme').addEventListener('click', ()=>{
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(next); store.set(next);
  });
})();

/* ---------- helpers ---------- */
const ipToInt = s => s.split('.').reduce((a,o)=>((a<<8)>>>0)+ (+o),0)>>>0;
const intToIp = n => [24,16,8,0].map(s=>(n>>>s)&255).join('.');
const maskOf  = p => p===0 ? 0 : (0xFFFFFFFF << (32-p))>>>0;
const toHex   = n => '0x'+n.toString(16).toUpperCase().padStart(8,'0');
const bin32   = n => n.toString(2).padStart(32,'0');
const binDot  = n => bin32(n).match(/.{8}/g).join('.');
const fmt     = n => n.toLocaleString('en-US');

/* attribute-safe escaping + row builders with copy button */
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const cpBtn = txt => (txt==null || txt==='—') ? ''
  : `<button class="cp" data-copy="${esc(txt)}" title="Copy to clipboard">Copy</button>`;
const row = (k, html, copy) =>
  `<tr><td class="k">${k}</td><td class="v"><span class="txt">${html}</span>${cpBtn(copy)}</td></tr>`;

/* clipboard with file:// fallback */
function copyText(text, btn){
  const done = ok => {
    btn.textContent = ok ? 'Copied' : 'Failed';
    btn.classList.toggle('done', ok);
    setTimeout(()=>{ btn.textContent='Copy'; btn.classList.remove('done'); }, 1200);
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>done(true), ()=>done(fallback(text)));
  } else {
    done(fallback(text));
  }
}
function fallback(text){
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
  document.body.appendChild(ta); ta.select();
  let ok=false; try{ ok = document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta);
  return ok;
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('.cp');
  if(btn) copyText(btn.dataset.copy, btn);
});

/* dotted mask or wildcard -> prefix length (null if not contiguous) */
function maskToPrefix(n){
  const b = bin32(n);
  if(/^1*0*$/.test(b)) return b.indexOf('0') === -1 ? 32 : b.indexOf('0');  // subnet mask
  if(/^0*1*$/.test(b)) return b.indexOf('1');                               // wildcard mask
  return null;
}

function validIp(s){
  const p = s.split('.');
  if(p.length!==4) return false;
  return p.every(o=>/^\d{1,3}$/.test(o) && +o<=255);
}

/* coloured binary: first `prefix` bits = network, rest = host */
function binHtml(n, prefix){
  const b = bin32(n); let out='';
  for(let i=0;i<32;i++){
    if(i && i%8===0) out += '<span class="d">.</span>';
    out += `<span class="${i<prefix?'n':'h'}">${b[i]}</span>`;
  }
  return out;
}
function binPlain(n){
  return binDot(n).replace(/\./g,'<span class="d">.</span>');
}

function ipClass(n){
  const f = (n>>>24)&255;
  if(f<128) return 'A';
  if(f<192) return 'B';
  if(f<224) return 'C';
  if(f<240) return 'D (multicast)';
  return 'E (reserved)';
}
function ipType(n){
  const a=(n>>>24)&255, b=(n>>>16)&255;
  if(a===10) return ['Private (RFC 1918)','priv'];
  if(a===172 && b>=16 && b<=31) return ['Private (RFC 1918)','priv'];
  if(a===192 && b===168) return ['Private (RFC 1918)','priv'];
  if(a===127) return ['Loopback','pub'];
  if(a===169 && b===254) return ['APIPA / link-local','pub'];
  if(a===100 && b>=64 && b<=127) return ['CGNAT (RFC 6598)','pub'];
  if(a>=224 && a<240) return ['Multicast','pub'];
  if(a>=240) return ['Reserved','pub'];
  if(a===0) return ['"This network"','pub'];
  return ['Public','pub'];
}

/* ---------- populate dropdown ---------- */
(function(){
  let html='';
  for(let p=32;p>=0;p--){
    const m=maskOf(p), w=(~m)>>>0;
    const total=Math.pow(2,32-p);
    const usable = p<=30 ? total-2 : (p===31?2:1);
    html += `<option value="${p}">/${p} — ${intToIp(m)} — WC ${intToIp(w)} — ${fmt(usable)} hosts</option>`;
  }
  $('sel').innerHTML = html;
})();

/* ---------- collapse / expand ---------- */
document.querySelectorAll('.toggle').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const card = $(btn.dataset.target);
    const hidden = card.classList.toggle('collapsed');
    btn.textContent = hidden ? 'Show' : 'Hide';
  });
});

/* ---------- calculate + render ---------- */
/* how the address is currently written - the field is kept in this shape
   when the prefix is changed via slider or dropdown */
let inputMode = 'plain';          // plain | cidr | mask | wildcard
let lastIpStr = '192.168.10.55';

function syncField(prefix){
  const el = $('ip');
  const head = (el.value.trim().split(/[\s\/]/)[0]) || '';
  const ipStr = validIp(head) ? head : lastIpStr;
  if(inputMode === 'cidr')          el.value = ipStr + '/' + prefix;
  else if(inputMode === 'mask')     el.value = ipStr + ' ' + intToIp(maskOf(prefix));
  else if(inputMode === 'wildcard') el.value = ipStr + ' ' + intToIp((~maskOf(prefix))>>>0);
}

function render(){
  const raw = $('ip').value.trim();
  let ipStr = raw, prefix = +$('mRange').value;

  const fail = msg => { $('ip').classList.add('err'); $('err').textContent = msg; };
  const quiet = () => { $('ip').classList.remove('err'); $('err').textContent = ''; };
  const incomplete = s => /\.$/.test(s) || s.split('.').length < 4;

  const cidrM = raw.match(/^(.+?)\s*\/\s*(\d{1,2})$/);   // 192.168.10.55/26
  const maskM = raw.match(/^(\S+)[ \t]+(\S*)$/);         // 192.168.10.55 255.255.0.0

  if(cidrM && validIp(cidrM[1].trim()) && +cidrM[2] <= 32){
    inputMode = 'cidr';
    ipStr = cidrM[1].trim();
    prefix = +cidrM[2];
    setPrefix(prefix, false);
  } else if(maskM){
    ipStr = maskM[1];
    const maskStr = maskM[2];
    if(!validIp(maskStr)){ quiet(); if(!incomplete(maskStr)) fail('Invalid mask'); return; }
    const mi = ipToInt(maskStr);
    const p = maskToPrefix(mi);
    if(p === null){ fail('Not a contiguous subnet or wildcard mask'); return; }
    inputMode = (mi !== 0 && (mi >>> 31) === 0) ? 'wildcard' : 'mask';
    prefix = p;
    setPrefix(prefix, false);
  } else {
    inputMode = 'plain';
  }

  if(!validIp(ipStr)){
    // still mid-entry (trailing dot / incomplete) -> stay quiet, keep last result
    quiet();
    if(!incomplete(ipStr)) fail('Invalid IPv4 address');
    return;
  }
  quiet();
  lastIpStr = ipStr;

  const ip   = ipToInt(ipStr);
  const mask = maskOf(prefix);
  const wc   = (~mask)>>>0;
  const net  = (ip & mask)>>>0;
  const bc   = (net | wc)>>>0;
  const total = Math.pow(2,32-prefix);
  const usable = prefix<=30 ? total-2 : (prefix===31?2:1);
  const first = prefix<=30 ? net+1 : net;
  const last  = prefix<=30 ? bc-1  : bc;
  const [type,cls] = ipType(ip);

  const bcS    = prefix<=30 ? intToIp(bc) : '—';
  const firstS = prefix<=31 ? intToIp(first) : '—';
  const lastS  = prefix<=31 ? intToIp(last)  : '—';
  const rangeS = prefix<=31 ? firstS+' - '+lastS : intToIp(ip);

  $('t1').innerHTML =
    row('IP address',         ipStr,                      ipStr) +
    row('CIDR notation',      ipStr+'/'+prefix,           ipStr+'/'+prefix) +
    row('Subnet mask',        intToIp(mask),              intToIp(mask)) +
    row('Wildcard mask',      intToIp(wc),                intToIp(wc)) +
    row('Network address',    intToIp(net)+'/'+prefix,    intToIp(net)+'/'+prefix) +
    row('Broadcast address',  bcS,                        bcS) +
    row('Network / host bits', prefix+' / '+(32-prefix),  prefix+' / '+(32-prefix)) +
    row('Class (classful)',   ipClass(ip),                ipClass(ip)) +
    row('Type', `<span class="badge ${cls}">${type}</span>`, type);

  $('t2').innerHTML =
    row('First host address', firstS,   firstS) +
    row('Last host address',  lastS,    lastS) +
    row('Host range',         rangeS,   rangeS) +
    row('Usable hosts',       fmt(usable), String(usable)) +
    row('Total addresses',    `${fmt(total)} (2<sup>${32-prefix}</sup>)`, String(total)) +
    row('Full range',         intToIp(net)+' - '+intToIp(bc), intToIp(net)+' - '+intToIp(bc)) +
    row('IP as decimal',      String(ip),    String(ip)) +
    row('IP in hex',          toHex(ip),     toHex(ip)) +
    row('Mask in hex',        toHex(mask),   toHex(mask));

  const rows = [
    ['IP address',      binHtml(ip,prefix),   binDot(ip)],
    ['Subnet mask',     binPlain(mask),       binDot(mask)],
    ['Wildcard mask',   binPlain(wc),         binDot(wc)],
    ['Network address', binHtml(net,prefix),  binDot(net)],
    ['Broadcast',       binHtml(bc,prefix),   binDot(bc)],
    ['First host',      prefix<=31?binHtml(first,prefix):'—', prefix<=31?binDot(first):null],
    ['Last host',       prefix<=31?binHtml(last,prefix):'—',  prefix<=31?binDot(last):null]
  ];
  $('bins').innerHTML = rows.map(r=>
    `<div class="binrow"><span class="lab">${r[0]}</span><span class="bin">${r[1]}</span>${cpBtn(r[2])}</div>`
  ).join('');

  renderList(net, prefix);
}

/* ================= subnet list ================= */
let listRows = [];          // last generated list, also used for the export
let listMeta = {net:0, prefix:24};
let wantCount = 16;         // how many rows the user asked for
const SLIDER_MAX = 512;     // range of the slider
const TABLE_MAX  = 1024;    // rows drawn on screen (export is never truncated)
const HARD_MAX   = 65536;   // upper limit for the manual input

function buildList(net, prefix, count){
  const block = Math.pow(2, 32-prefix);
  const mask  = maskOf(prefix);
  const wc    = (~mask)>>>0;
  const rows  = [];
  for(let i=0; i<count; i++){
    const n = net + i*block;
    if(n > 0xFFFFFFFF) break;
    const b = (n + block - 1);
    rows.push({
      i: i+1,
      net: intToIp(n),
      cidr: '/'+prefix,
      mask: intToIp(mask),
      wildcard: intToIp(wc),
      bc: prefix<=30 ? intToIp(b) : '—',
      first: prefix<=31 ? intToIp(prefix<=30 ? n+1 : n) : intToIp(n),
      last:  prefix<=31 ? intToIp(prefix<=30 ? b-1 : b) : intToIp(n),
      hosts: prefix<=30 ? block-2 : (prefix===31?2:1)
    });
  }
  return rows;
}

function renderList(net, prefix){
  const block = Math.pow(2, 32-prefix);
  const avail = Math.floor((4294967296 - net) / block);   // subnets left above the start
  const slider = $('cntRange'), num = $('cntNum');
  const max = Math.max(1, Math.min(HARD_MAX, avail));      // limited by the address space
  const count = Math.min(wantCount, max);                  // wish is kept, only capped
  slider.max = Math.min(SLIDER_MAX, max);
  slider.value = Math.min(count, +slider.max);
  num.max = max; num.value = count;

  listMeta = {net, prefix};
  listRows = buildList(net, prefix, count);

  // very long lists stay complete in the export, the table only shows the first rows
  const shown = listRows.slice(0, TABLE_MAX);
  $('listNote').textContent = shown.length < listRows.length
    ? `Showing the first ${fmt(TABLE_MAX)} of ${fmt(listRows.length)} subnets — the .xlsx export contains all of them.`
    : (count === max && avail <= HARD_MAX
        ? `${fmt(count)} subnet${count===1?'':'s'} — end of the address space reached.` : '');

  const head = `<thead><tr><th>#</th><th>Network</th><th>CIDR</th><th>Netmask</th>
      <th>Wildcard</th><th>Broadcast</th><th>First host</th><th>Last host</th>
      <th>Hosts</th><th></th></tr></thead>`;
  // data-label feeds the card layout used on phones
  const body = shown.map(r=>
    `<tr><td class="idx">${r.i}</td>
     <td data-label="Network">${r.net}</td>
     <td data-label="CIDR">${r.cidr}</td>
     <td data-label="Netmask">${r.mask}</td>
     <td data-label="Wildcard">${r.wildcard}</td>
     <td data-label="Broadcast">${r.bc}</td>
     <td data-label="First host">${r.first}</td>
     <td data-label="Last host">${r.last}</td>
     <td data-label="Hosts">${fmt(r.hosts)}</td>
     <td class="act">${cpBtn(r.net+r.cidr+'  '+r.mask)}</td></tr>`).join('');
  $('tList').innerHTML = head + '<tbody>' + body + '</tbody>';
}

$('cntRange').addEventListener('input', e=>{
  wantCount = +e.target.value;
  renderList(listMeta.net, listMeta.prefix);
});
$('cntNum').addEventListener('input', e=>{
  const v = parseInt(e.target.value, 10);
  if(!Number.isFinite(v) || v < 1) return;          // stay quiet while typing
  wantCount = Math.min(v, HARD_MAX);
  renderList(listMeta.net, listMeta.prefix);
});
$('cntNum').addEventListener('blur', ()=>renderList(listMeta.net, listMeta.prefix));

/* ---------- minimal XLSX writer (stored ZIP, no dependencies) ---------- */
const CRC_T = (()=>{ const t=new Uint32Array(256);
  for(let i=0;i<256;i++){ let c=i; for(let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[i]=c>>>0; }
  return t; })();
const crc32 = buf => { let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c = CRC_T[(c^buf[i])&0xFF] ^ (c>>>8);
  return (c^0xFFFFFFFF)>>>0; };
const enc = s => new TextEncoder().encode(s);

function zipStore(files){
  const parts=[], central=[]; let off=0;
  for(const f of files){
    const name = enc(f.name), data = f.data, crc = crc32(data), len = data.length;
    const lh = new Uint8Array(30+name.length), dv = new DataView(lh.buffer);
    dv.setUint32(0,0x04034b50,true); dv.setUint16(4,20,true); dv.setUint16(6,0x0800,true);
    dv.setUint16(8,0,true); dv.setUint16(10,0,true); dv.setUint16(12,0x21,true);
    dv.setUint32(14,crc,true); dv.setUint32(18,len,true); dv.setUint32(22,len,true);
    dv.setUint16(26,name.length,true); dv.setUint16(28,0,true);
    lh.set(name,30); parts.push(lh, data);

    const cd = new Uint8Array(46+name.length), cv = new DataView(cd.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x0800,true); cv.setUint16(10,0,true); cv.setUint16(12,0,true);
    cv.setUint16(14,0x21,true); cv.setUint32(16,crc,true);
    cv.setUint32(20,len,true); cv.setUint32(24,len,true);
    cv.setUint16(28,name.length,true); cv.setUint32(42,off,true);
    cd.set(name,46); central.push(cd);
    off += lh.length + len;
  }
  const cdSize = central.reduce((a,c)=>a+c.length,0);
  const end = new Uint8Array(22), ev = new DataView(end.buffer);
  ev.setUint32(0,0x06054b50,true);
  ev.setUint16(8,files.length,true); ev.setUint16(10,files.length,true);
  ev.setUint32(12,cdSize,true); ev.setUint32(16,off,true);
  return new Blob([...parts, ...central, end],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

const xmlEsc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const colRef = i => { let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=(i-m-1)/26; } return s; };

function sheetXml(rows){
  const body = rows.map((row,r)=>{
    const cells = row.map((v,c)=>{
      const ref = colRef(c)+(r+1);
      return (typeof v === 'number')
        ? `<c r="${ref}"><v>${v}</v></c>`
        : `<c r="${ref}" t="inlineStr"><is><t>${xmlEsc(v)}</t></is></c>`;
    }).join('');
    return `<row r="${r+1}">${cells}</row>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<cols><col min="1" max="1" width="5"/><col min="2" max="9" width="18"/></cols>
<sheetData>${body}</sheetData></worksheet>`;
}

function downloadXlsx(){
  const rows = [['#','Network','CIDR','Netmask','Wildcard','Broadcast','First host','Last host','Usable hosts']];
  listRows.forEach(r=>rows.push([r.i, r.net, r.cidr, r.mask, r.wildcard, r.bc, r.first, r.last, r.hosts]));

  const files = [
    {name:'[Content_Types].xml', data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
</Types>`)},
    {name:'_rels/.rels', data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`)},
    {name:'xl/workbook.xml', data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"
 xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="Subnets" sheetId="1" r:id="rId1"/></sheets></workbook>`)},
    {name:'xl/_rels/workbook.xml.rels', data: enc(`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
</Relationships>`)},
    {name:'xl/worksheets/sheet1.xml', data: enc(sheetXml(rows))}
  ];

  const url = URL.createObjectURL(zipStore(files));
  const a = document.createElement('a');
  a.href = url;
  a.download = `subnets_${intToIp(listMeta.net).replace(/\./g,'-')}_${listMeta.prefix}_${listRows.length}.xlsx`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 2000);
}
$('xlsx').addEventListener('click', downloadXlsx);

function setPrefix(p, doRender=true){
  $('mRange').value = p;
  $('wcRange').value = 32-p;
  $('sel').value = p;
  $('mLbl').textContent = '/'+p;
  $('wLbl').textContent = 32-p;
  if(doRender){ syncField(p); render(); }
}

$('mRange').addEventListener('input', e=>setPrefix(+e.target.value));
$('wcRange').addEventListener('input', e=>setPrefix(32-+e.target.value));
$('sel').addEventListener('change', e=>setPrefix(+e.target.value));
/* ---------- smart IP input: auto-dot, no double dots ---------- */
function normalizeIp(raw, autoDot){
  // second form: "192.168.10.55 255.255.0.0" - normalise both halves
  const sep = raw.match(/^([^\/\s]*)([\/ ])([\s\S]*)$/);
  if(sep){
    const head = normOctets(sep[1], false).replace(/\.$/,'');
    if(sep[2] === '/') return head + '/' + sep[3].replace(/\D/g,'').slice(0,2);
    return head + ' ' + normOctets(sep[3].replace(/[\/\s]/g,''), autoDot);
  }
  return normOctets(raw, autoDot);
}

function normOctets(raw, autoDot){
  const clean = raw.replace(/[^\d.]/g,'').replace(/^\.+/,'');
  const parts = [''];

  for(const ch of clean){
    const cur = parts[parts.length-1];
    if(ch === '.'){
      // a typed dot only starts a new octet - never produces a second dot
      if(cur !== '' && parts.length < 4) parts.push('');
      continue;
    }
    // octet full, would exceed 255, or a lone leading zero -> digit belongs to the next octet
    if(cur.length === 3 || (cur !== '' && +(cur+ch) > 255) || cur === '0'){
      if(parts.length < 4) parts.push(ch);
    } else {
      parts[parts.length-1] = cur + ch;
    }
  }

  let v = parts.join('.');

  // set the dot automatically once the octet cannot grow any further
  if(autoDot && parts.length < 4){
    const last = parts[parts.length-1];
    if(last.length === 3 || (last.length === 2 && +last > 25) || last === '0') v += '.';
  }
  return v;
}

$('ip').addEventListener('input', e=>{
  const el = e.target, before = el.value;
  const atEnd = el.selectionStart === before.length;
  const deleting = (e.inputType||'').startsWith('delete');
  const after = normalizeIp(before, !deleting && atEnd);

  if(after !== before){
    const pos = el.selectionStart, delta = after.length - before.length;
    el.value = after;
    const np = atEnd ? after.length : Math.max(0, pos + delta);
    el.setSelectionRange(np, np);
  }
  render();
});

setPrefix(24);
